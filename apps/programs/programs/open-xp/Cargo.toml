[package]
name = "open-xp"
version = "0.1.0"
description = "Trustless Exam System - Solana Program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "open_xp"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
